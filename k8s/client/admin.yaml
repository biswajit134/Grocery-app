apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: client
  labels:
    app: admin
    app.kubernetes.io/part-of: groceryhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin
        app.kubernetes.io/part-of: groceryhub
    spec:
      containers:
        - name: admin
          image: biswajit134/grocery-admin-app:latest
          ports:
            - containerPort: 3003
              protocol: TCP
          env:
            - name: VITE_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: client-config
                  key: VITE_AUTH_URL
            - name: VITE_PRODUCT_URL
              valueFrom:
                configMapKeyRef:
                  name: client-config
                  key: VITE_PRODUCT_URL
            - name: VITE_ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: client-config
                  key: VITE_ORDER_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: client
  labels:
    app: admin
    app.kubernetes.io/part-of: groceryhub
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
      name: http
