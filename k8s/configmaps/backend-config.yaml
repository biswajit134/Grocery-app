apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend
  labels:
    app.kubernetes.io/part-of: groceryhub
data:
  # Database connections (cross-namespace FQDN)
  MONGO_URI_AUTH: "mongodb://mongodb.database.svc.cluster.local:27017/grocery_auth"
  MONGO_URI_PRODUCTS: "mongodb://mongodb.database.svc.cluster.local:27017/grocery_products"
  MONGO_URI_ORDERS: "mongodb://mongodb.database.svc.cluster.local:27017/grocery_orders"
  REDIS_URL: "redis://redis.database.svc.cluster.local:6379"

  # Service ports
  AUTH_SERVICE_PORT: "5001"
  PRODUCT_SERVICE_PORT: "5002"
  ORDER_SERVICE_PORT: "5003"
  API_GATEWAY_PORT: "5000"

  # Inter-service communication (within backend namespace)
  AUTH_SERVICE_URL: "http://auth-service.backend.svc.cluster.local:5001"
  PRODUCT_SERVICE_URL: "http://product-service.backend.svc.cluster.local:5002"
  ORDER_SERVICE_URL: "http://order-service.backend.svc.cluster.local:5003"
