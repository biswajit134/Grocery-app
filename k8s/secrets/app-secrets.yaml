# WARNING: Replace the JWT_SECRET value before deploying to production!
# To generate a base64-encoded secret:
#   echo -n "your-secure-jwt-secret-here" | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: backend
  labels:
    app.kubernetes.io/part-of: groceryhub
type: Opaque
data:
  # Default placeholder — MUST be changed before production
  # Decoded value: "supersecretjwtkeyforgroceryhub"
  JWT_SECRET: eW91ci1zdHJvbmctc2VjcmV0LWtleS1oZXJl
