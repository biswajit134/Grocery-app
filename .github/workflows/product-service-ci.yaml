name: product-service-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/services/product-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/services/product-service/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build product service and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src/services/product-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/grocery-product-service:latest
