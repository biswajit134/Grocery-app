name: services-ci
on:
  push:
    branches: [main]
    paths:
      - 'src/services/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/services/**'

  workflow_dispatch:




jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Auth service and push Docker image
        uses: docker/build-push-action@v7
        with:
            context: ./src/services/auth-service
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/grocery-auth-service:latest


      - name: Build product service and push Docker image
        uses: docker/build-push-action@v7
        with:
            context: ./src/services/product-service
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/grocery-product-service:latest


      - name: Build order service and push Docker image
        uses: docker/build-push-action@v7
        with:
            context: ./src/services/order-service
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/grocery-order-service:latest

