{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grocery-app.componentName" (dict "context" . "component" "order-service") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "order-service") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http-order
  selector:
    {{- include "grocery-app.selectorLabels" (dict "context" . "component" "order-service") | nindent 4 }}
{{- end }}
