global:
  imagePullPolicy: IfNotPresent
  domain: grocery.example.com


enabled: true
replicaCount: 2
image:
  repository: biswajit134/grocery-product-service
  tag: latest
port: 5002
service:
  type: ClusterIP
  port: 5002
env:
  PORT: "5002"
  REDIS_URL: "redis://grocery-app-redis:6379"
  # -- MONGO_URI is injected from secrets
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinity:
  enabled: true

