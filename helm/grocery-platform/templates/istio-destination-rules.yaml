{{- if .Values.istio.enabled }}
{{- $fullname := include "grocery-app.fullname" . }}
{{- $tp := .Values.istio.destinationRule.trafficPolicy }}
---
{{- if .Values.authService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $fullname }}-auth-service-dr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "auth-service") | nindent 4 }}
spec:
  host: {{ include "grocery-app.componentName" (dict "context" . "component" "auth-service") }}
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: {{ $tp.connectionPool.tcp.maxConnections }}
      http:
        h2UpgradePolicy: {{ $tp.connectionPool.http.h2UpgradePolicy }}
        http1MaxPendingRequests: {{ $tp.connectionPool.http.http1MaxPendingRequests }}
        http2MaxRequests: {{ $tp.connectionPool.http.http2MaxRequests }}
        maxRequestsPerConnection: {{ $tp.connectionPool.http.maxRequestsPerConnection }}
    outlierDetection:
      consecutive5xxErrors: {{ $tp.outlierDetection.consecutive5xxErrors }}
      interval: {{ $tp.outlierDetection.interval }}
      baseEjectionTime: {{ $tp.outlierDetection.baseEjectionTime }}
      maxEjectionPercent: {{ $tp.outlierDetection.maxEjectionPercent }}
    tls:
      mode: {{ $tp.tls.mode }}
{{- end }}
