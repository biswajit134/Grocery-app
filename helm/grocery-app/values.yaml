# =============================================================================
# Grocery-App Helm Chart — Default Values
# =============================================================================
# This file declares all configurable parameters for the Grocery-App chart.
# Override these values using --set, --values, or environment-specific files
# such as values-production.yaml.
# =============================================================================

# ---------------------------------------------------------------------------
# Global Configuration
# ---------------------------------------------------------------------------
global:
  # -- Kubernetes namespace for all resources
  namespace: grocery-app
  # -- Default image pull policy
  imagePullPolicy: IfNotPresent
  # -- Domain used for Istio Gateway host matching
  domain: "grocery.example.com"
  # -- Image pull secrets (if images are in a private registry)
  imagePullSecrets: []
  #   - name: my-registry-secret

# ---------------------------------------------------------------------------
# Istio Ingress Configuration
# ---------------------------------------------------------------------------
istio:
  # -- Enable Istio Gateway and VirtualService resources
  enabled: true
  gateway:
    # -- Name of the Istio Gateway resource
    name: grocery-gateway
    # -- Istio ingress gateway selector
    ingressGatewaySelector: istio-ingressgateway
    servers:
      - port:
          number: 80
          name: http
          protocol: HTTP
        # -- Set to HTTPS and provide TLS config for production
        # tls:
        #   mode: SIMPLE
        #   credentialName: grocery-tls-cert
  virtualService:
    # -- Timeout for upstream requests
    timeout: 30s
    retries:
      # -- Number of retry attempts
      attempts: 3
      # -- Retry on these status codes
      retryOn: "5xx,reset,connect-failure,retriable-4xx"
      # -- Per-retry timeout
      perTryTimeout: 10s
    corsPolicy:
      allowOrigins:
        - exact: "*"
      allowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowHeaders:
        - content-type
        - authorization
        - x-requested-with
      maxAge: "24h"
  destinationRule:
    # -- Traffic policy for all services
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 100
        http:
          h2UpgradePolicy: DEFAULT
          http1MaxPendingRequests: 100
          http2MaxRequests: 1000
          maxRequestsPerConnection: 10
      outlierDetection:
        consecutive5xxErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
      tls:
        mode: ISTIO_MUTUAL

# ---------------------------------------------------------------------------
# Auth Service
# ---------------------------------------------------------------------------
authService:
  enabled: true
  replicaCount: 2
  image:
    repository: biswajit134/grocery-auth-service
    tag: latest
  port: 5001
  service:
    type: ClusterIP
    port: 5001
  env:
    PORT: "5001"
    # -- MONGO_URI is injected from secrets
    # -- JWT_SECRET is injected from secrets
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinity:
    enabled: true

