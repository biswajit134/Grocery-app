# ---------------------------------------------------------------------------
# MongoDB
# ---------------------------------------------------------------------------
mongodb:
  # -- Set to false to use an external MongoDB instance
  enabled: true
  image:
    repository: mongo
    tag: "6.0"
  port: 27017
  storage:
    size: 10Gi
    # -- Leave empty to use cluster default StorageClass
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
redis:
  # -- Set to false to use an external Redis instance
  enabled: true
  image:
    repository: redis
    tag: alpine
  port: 6379
  storage:
    size: 2Gi
    # -- Leave empty to use cluster default StorageClass
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  # -- JWT secret key (MUST be overridden at install time via --set)
  jwtSecret: "CHANGE_ME_IN_PRODUCTION"
  # -- MongoDB URIs per service (auto-generated if mongodb.enabled=true)
  mongoUri:
    auth: ""
    products: ""
    orders: ""

# ---------------------------------------------------------------------------
# Network Policies
# ---------------------------------------------------------------------------
networkPolicy:
  # -- Enable Kubernetes NetworkPolicies for service isolation
  enabled: true
