{{- if .Values.vendor.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "grocery-app.componentName" (dict "context" . "component" "vendor") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "vendor") | nindent 4 }}
spec:
  minAvailable: {{ .Values.vendor.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" . "component" "vendor") | nindent 6 }}
{{- end }}
