{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grocery-app.componentName" (dict "context" . "component" "api-gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "api-gateway") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
