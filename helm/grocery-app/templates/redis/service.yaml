{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grocery-app.componentName" (dict "context" . "component" "redis") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  # Headless service for StatefulSet stable network identity
  clusterIP: None
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
      name: tcp-redis
  selector:
    {{- include "grocery-app.selectorLabels" (dict "context" . "component" "redis") | nindent 4 }}
{{- end }}
