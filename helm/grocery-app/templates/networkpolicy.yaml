{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "grocery-app.fullname" . }}
# =============================================================================
# NetworkPolicy: Backend services — accept traffic only from Istio sidecar
# =============================================================================
{{- range $svc := list "auth-service" "product-service" "order-service" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $svc }}-netpol
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" $ "component" $svc) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" $ "component" $svc) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the namespace (Istio sidecar, other services)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
    # Allow traffic from Istio ingress gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
{{- end }}

# =============================================================================
# NetworkPolicy: Frontend apps — accept traffic only from Istio ingress
# =============================================================================
{{- range $svc := list "frontend" "delivery-partner" "vendor" "admin" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $svc }}-netpol
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" $ "component" $svc) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" $ "component" $svc) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
{{- end }}

# =============================================================================
# NetworkPolicy: MongoDB — accept traffic only from backend services
# =============================================================================
{{- if .Values.mongodb.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mongodb-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" . "component" "mongodb") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-service
                  - product-service
                  - order-service
      ports:
        - protocol: TCP
          port: {{ .Values.mongodb.port }}
{{- end }}

# =============================================================================
# NetworkPolicy: Redis — accept traffic only from product-service
# =============================================================================
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-redis-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" . "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
{{- end }}
{{- end }}
