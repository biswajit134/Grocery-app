{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "grocery-app.fullname" . }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.global.domain | quote }}
  gateways:
    - {{ include "grocery-app.fullname" . }}-gateway
  http:
    # ─────────────────────────────────────────────
    # API Routes (must come before frontend routes)
    # ─────────────────────────────────────────────
    {{- if .Values.apiGateway.enabled }}
    - name: api-gateway
      match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: {{ include "grocery-app.componentName" (dict "context" . "component" "api-gateway") }}
            port:
              number: {{ .Values.apiGateway.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
      retries:
        attempts: {{ .Values.istio.virtualService.retries.attempts }}
        retryOn: {{ .Values.istio.virtualService.retries.retryOn | quote }}
        perTryTimeout: {{ .Values.istio.virtualService.retries.perTryTimeout }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.istio.virtualService.corsPolicy.allowOrigins }}
          - exact: {{ .exact | quote }}
          {{- end }}
        allowMethods:
          {{- toYaml .Values.istio.virtualService.corsPolicy.allowMethods | nindent 10 }}
        allowHeaders:
          {{- toYaml .Values.istio.virtualService.corsPolicy.allowHeaders | nindent 10 }}
        maxAge: {{ .Values.istio.virtualService.corsPolicy.maxAge | quote }}
    {{- end }}

    # ─────────────────────────────────────────────
    # Frontend App Routes
    # ─────────────────────────────────────────────
    {{- if .Values.admin.enabled }}
    - name: admin-app
      match:
        - uri:
            prefix: /admin
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "grocery-app.componentName" (dict "context" . "component" "admin") }}
            port:
              number: {{ .Values.admin.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
    {{- end }}

    {{- if .Values.vendor.enabled }}
    - name: vendor-app
      match:
        - uri:
            prefix: /vendor
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "grocery-app.componentName" (dict "context" . "component" "vendor") }}
            port:
              number: {{ .Values.vendor.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
    {{- end }}

    {{- if .Values.deliveryPartner.enabled }}
    - name: delivery-app
      match:
        - uri:
            prefix: /delivery
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "grocery-app.componentName" (dict "context" . "component" "delivery-partner") }}
            port:
              number: {{ .Values.deliveryPartner.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
    {{- end }}

    {{- if .Values.frontend.enabled }}
    - name: frontend-app
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "grocery-app.componentName" (dict "context" . "component" "frontend") }}
            port:
              number: {{ .Values.frontend.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
    {{- end }}
{{- end }}
