global:
  imagePullPolicy: IfNotPresent
  domain: grocery.example.com


enabled: true
replicaCount: 2
image:
  repository: biswajit134/grocery-api-gateway
  tag: latest
port: 5000
service:
  type: ClusterIP
  port: 5000
env:
  PORT: "5000"
  AUTH_SERVICE_URL: "http://grocery-app-auth-service:5001"
  PRODUCT_SERVICE_URL: "http://grocery-app-product-service:5002"
  ORDER_SERVICE_URL: "http://grocery-app-order-service:5003"
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinity:
  enabled: true

# ---------------------------------------------------------------------------
# Auth Service
