{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grocery-app.componentName" (dict "context" . "component" "api-gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grocery-app.componentLabels" (dict "context" . "component" "api-gateway") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grocery-app.selectorLabels" (dict "context" . "component" "api-gateway") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "grocery-app.componentLabels" (dict "context" . "component" "api-gateway") | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      {{- include "grocery-app.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "grocery-app.componentName" (dict "context" . "component" "api-gateway") }}
      terminationGracePeriodSeconds: 30
      {{- include "grocery-app.backendSecurityContext" . | nindent 6 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.env.AUTH_SERVICE_URL | quote }}
            - name: PRODUCT_SERVICE_URL
              value: {{ .Values.env.PRODUCT_SERVICE_URL | quote }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.env.ORDER_SERVICE_URL | quote }}
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "grocery-app.containerSecurityContext" . | nindent 10 }}
      {{- if .Values.podAntiAffinity.enabled }}
      {{- include "grocery-app.podAntiAffinity" (dict "component" "api-gateway") | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
