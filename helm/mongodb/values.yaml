global:
  imagePullPolicy: IfNotPresent
  domain: grocery.example.com


# -- Set to false to use an external MongoDB instance
enabled: true
image:
  repository: mongo
  tag: "6.0"
port: 27017
storage:
  size: 10Gi
  # -- Leave empty to use cluster default StorageClass
  storageClass: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
nodeSelector: {}
tolerations: []
affinity: {}

