services:
  mongodb:
    image: mongo:6.0
    container_name: grocery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - grocery-network

  redis:
    image: redis:alpine
    container_name: grocery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grocery-network

  auth-service:
    build: ./services/auth-service
    container_name: grocery-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/grocery_auth
      - JWT_SECRET=supersecretjwtkeyforgroceryhub
    depends_on:
      - mongodb
    networks:
      - grocery-network

  product-service:
    build: ./services/product-service
    container_name: grocery-product-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/grocery_products
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - grocery-network

  order-service:
    build: ./services/order-service
    container_name: grocery-order-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/grocery_orders
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - JWT_SECRET=supersecretjwtkeyforgroceryhub
    depends_on:
      - mongodb
    networks:
      - grocery-network

  api-gateway:
    build: ./services/api-gateway
    container_name: grocery-api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  frontend:
    build: ./frontend
    container_name: grocery-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  delivery-partner:
    build: ./delivery-partner
    container_name: grocery-delivery-partner
    ports:
      - "3001:3001"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - order-service
    networks:
      - grocery-network

  vendor:
    build: ./vendor
    container_name: grocery-vendor
    ports:
      - "3002:3002"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
    depends_on:
      - auth-service
      - product-service
    networks:
      - grocery-network

  admin:
    build: ./admin
    container_name: grocery-admin
    ports:
      - "3003:3003"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

volumes:
  mongodb_data:
  redis_data:

networks:
  grocery-network:
    driver: bridge
