services:
  mongodb:
    image: mongo:6.0
    container_name: grocery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - grocery-network

  redis:
    image: redis:alpine
    container_name: grocery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grocery-network

  auth-service:
    image: biswajit134/grocery-auth-service:latest
    container_name: grocery-auth-service
    ports:
      - "5001:5001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - mongodb
    networks:
      - grocery-network

  product-service:
    image: biswajit134/grocery-product-service:latest
    container_name: grocery-product-service
    ports:
      - "5002:5002"
    env_file:
      - ./services/product-service/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - grocery-network

  order-service:
    image: biswajit134/grocery-order-service:latest
    container_name: grocery-order-service
    ports:
      - "5003:5003"
    env_file:
      - ./services/order-service/.env
    depends_on:
      - mongodb
    networks:
      - grocery-network

  frontend:
    image: biswajit134/grocery-frontend-app:latest
    container_name: grocery-frontend-app
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  delivery-partner:
    image: biswajit134/grocery-delivery-app:latest
    container_name: grocery-delivery-app
    ports:
      - "3001:3001"
    depends_on:
      - auth-service
      - order-service
    networks:
      - grocery-network

  vendor:
    image: biswajit134/grocery-vendor-app:latest
    container_name: grocery-vendor-app
    ports:
      - "3002:3002"
    depends_on:
      - auth-service
      - product-service
    networks:
      - grocery-network

  admin:
    image: biswajit134/grocery-admin-app:latest
    container_name: grocery-admin-app
    ports:
      - "3003:3003"
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

volumes:
  mongodb_data:
  redis_data:

networks:
  grocery-network:
    driver: bridge
