services:
  mongodb:
    image: mongo:6.0
    container_name: grocery-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword123
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - grocery-network

  redis:
    image: redis:alpine
    container_name: grocery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grocery-network

  mongo-express:
    image: mongo-express:1.0
    container_name: grocery-mongo-dashboard
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=adminpassword123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:adminpassword123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grocery-network

  auth-service:
    image: biswajit134/grocery-auth-service:latest
    container_name: grocery-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://admin:adminpassword123@mongodb:27017/grocery_auth?authSource=admin
      - JWT_SECRET=supersecretjwtkeyforgroceryhub
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grocery-network

  product-service:
    image: biswajit134/grocery-product-service:latest
    container_name: grocery-product-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://admin:adminpassword123@mongodb:27017/grocery_products?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - grocery-network

  order-service:
    image: biswajit134/grocery-order-service:latest
    container_name: grocery-order-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://admin:adminpassword123@mongodb:27017/grocery_orders?authSource=admin
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - JWT_SECRET=supersecretjwtkeyforgroceryhub
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grocery-network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    # image: biswajit134/grocery-api-gateway:latest
    # container_name: grocery-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - ORDER_SERVICE_URL=http://order-service:5003
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  frontend:
    image: biswajit134/grocery-frontend-app:latest
    container_name: grocery-frontend-app
    ports:
      - "3000:3000"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  delivery-partner:
    image: biswajit134/grocery-delivery-app:latest
    container_name: grocery-delivery-app
    ports:
      - "3001:3001"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - order-service
    networks:
      - grocery-network

  vendor:
    image: biswajit134/grocery-vendor-app:latest
    container_name: grocery-vendor-app
    ports:
      - "3002:3002"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
    depends_on:
      - auth-service
      - product-service
    networks:
      - grocery-network

  admin:
    image: biswajit134/grocery-admin-app:latest
    container_name: grocery-admin-app
    ports:
      - "3003:3003"
    environment:
      - VITE_AUTH_URL=http://localhost:5000/api/auth
      - VITE_PRODUCT_URL=http://localhost:5000/api/products
      - VITE_ORDER_URL=http://localhost:5000/api/orders
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - grocery-network

  gateway-dashboard:
    build:
      context: ./gateway-dashboard
      dockerfile: Dockerfile
    # image: biswajit134/grocery-gateway-dashboard:latest
    # container_name: grocery-gateway-dashboard
    ports:
      - "3004:3004"
    environment:
      - VITE_GATEWAY_URL=http://localhost:5000
    depends_on:
      - api-gateway
    networks:
      - grocery-network

volumes:
  mongodb_data:
  redis_data:

networks:
  grocery-network:
    driver: bridge
