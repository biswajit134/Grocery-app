# Example manifest template for out-of-band secret creation
# In production, populate data via SealedSecrets, ExternalSecrets, or CI/CD pipelines
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: grocery-backend
  labels:
    app.kubernetes.io/part-of: grocery-backend
type: Opaque
stringData:
  JWT_SECRET: "<GENERATE_STRONG_JWT_SECRET>"
  AUTH_MONGO_URI: "mongodb://<USER>:<PASSWORD>@mongodb-svc.grocery-database.svc.cluster.local:27017/grocery_auth?authSource=admin"
  PRODUCT_MONGO_URI: "mongodb://<USER>:<PASSWORD>@mongodb-svc.grocery-database.svc.cluster.local:27017/grocery_products?authSource=admin"
  ORDER_MONGO_URI: "mongodb://<USER>:<PASSWORD>@mongodb-svc.grocery-database.svc.cluster.local:27017/grocery_orders?authSource=admin"

