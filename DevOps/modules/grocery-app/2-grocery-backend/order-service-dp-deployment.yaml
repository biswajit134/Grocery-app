apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-dp
  namespace: grocery-backend
  labels:
    app: order-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - order-service
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: order-service
        image: biswajit134/grocery-order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5003
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: PORT
          value: "5003"
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PRODUCT_SERVICE_URL
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: ORDER_MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET
