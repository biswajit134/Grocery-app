apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vendor-hpa
  namespace: grocery-clint
  labels:
    app: vendor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vendor-dp
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
