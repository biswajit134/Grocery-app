apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dp
  namespace: grocery-clint
  labels:
    app: admin
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - admin
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: admin
        image: biswajit134/grocery-admin-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        # - name: PORT
        #   value: "3003"
        # - name: VITE_AUTH_URL
        #   value: "/api/auth"
        # - name: VITE_PRODUCT_URL
        #   value: "/api/products"
        # - name: VITE_ORDER_URL
        #   value: "/api/orders"
        # - name: API_GATEWAY_URL
        #   value: "http://istio-gateway.istio-gateway.svc.cluster.local:80"
        - name: API_GATEWAY_URL
          value: "http://api-gateway-svc.grocery-backend.svc.cluster.local:5000"
        # - name: API_GATEWAY_URL
        #   value: "/api"
        - name: SERVER_NAME
          value: "localhost"
