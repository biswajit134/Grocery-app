apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: grocery-database
  labels:
    app: redis
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        version: v1
    spec:
      containers:
      - name: redis
        image: redis:alpine
        volumeMounts:
        - name: redis-data
          mountPath: /data
        ports:
        - containerPort: 6379
          name: redis
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
