# Example manifest template for out-of-band secret creation
# In production, populate data via SealedSecrets, ExternalSecrets, or CI/CD pipelines
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: grocery-database
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "<CHANGE_ME_IN_PRODUCTION>"

