apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grocery-apps-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: groceryhub
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/biswajit134/Grocery-app.git
    targetRevision: HEAD
    path: DevOps/modules/ArgoCD-grocery-app/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
