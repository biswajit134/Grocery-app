apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grocery-backend
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: groceryhub
    app.kubernetes.io/tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/biswajit134/Grocery-app.git
    targetRevision: HEAD
    path: DevOps/grocery-hrlm-charts/grocery-backend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grocery-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
