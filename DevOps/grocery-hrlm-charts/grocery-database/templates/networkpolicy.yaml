{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grocery-database-netpol
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grocery-database.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Restrict database access strictly to microservices running in grocery-backend
    - from:
        - namespaceSelector:
            matchLabels:
              name: grocery-backend
      ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Istio Envoy control plane communication
    - to:
        - namespaceSelector:
            matchLabels:
              name: istio-system
      ports:
        - protocol: TCP
          port: 15012
{{- end }}
