{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mongodb.auth.secretName | default "mongodb-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.mongodb.name }}
    {{- include "grocery-database.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | default "vault-backend" }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.mongodb.auth.secretName | default "mongodb-secret" }}
    creationPolicy: Owner
  data:
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/database" }}
        property: MONGO_INITDB_ROOT_USERNAME
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/database" }}
        property: MONGO_INITDB_ROOT_PASSWORD
{{- end }}
