{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.mongodb.auth.secretName | default "mongodb-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.mongodb.name }}
    {{- include "grocery-database.labels" . | nindent 4 }}
spec:
  encryptedData:
    MONGO_INITDB_ROOT_USERNAME: {{ .Values.sealedSecret.encryptedData.MONGO_INITDB_ROOT_USERNAME | quote }}
    MONGO_INITDB_ROOT_PASSWORD: {{ .Values.sealedSecret.encryptedData.MONGO_INITDB_ROOT_PASSWORD | quote }}
  template:
    metadata:
      name: {{ .Values.mongodb.auth.secretName | default "mongodb-secret" }}
      namespace: {{ .Values.namespace }}
      labels:
        app: {{ .Values.mongodb.name }}
        {{- include "grocery-database.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
