{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.redis.name }}
    {{- include "grocery-database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.redis.name }}
  ports:
    - name: tcp-redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      appProtocol: tcp
      protocol: TCP
{{- end }}
