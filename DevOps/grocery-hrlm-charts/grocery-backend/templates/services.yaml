{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.serviceName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $service.appName }}
    {{- include "grocery-backend.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $service.appName }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: {{ $service.port }}
      protocol: TCP
{{- end }}
{{- end }}
