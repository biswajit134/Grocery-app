apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grocery-backend.labels" . | nindent 4 }}
data:
  AUTH_SERVICE_URL: {{ .Values.config.authServiceUrl | quote }}
  PRODUCT_SERVICE_URL: {{ .Values.config.productServiceUrl | quote }}
  ORDER_SERVICE_URL: {{ .Values.config.orderServiceUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RATE_LIMIT_GLOBAL_MAX: {{ .Values.config.rateLimitGlobalMax | default "10000" | quote }}
  RATE_LIMIT_AUTH_MAX: {{ .Values.config.rateLimitAuthMax | default "1000" | quote }}
