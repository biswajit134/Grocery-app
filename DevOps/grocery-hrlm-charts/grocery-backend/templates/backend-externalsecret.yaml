{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.secretName | default "backend-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grocery-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | default "vault-backend" }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.secrets.secretName | default "backend-secret" }}
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/backend" }}
        property: JWT_SECRET
    - secretKey: AUTH_MONGO_URI
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/backend" }}
        property: AUTH_MONGO_URI
    - secretKey: PRODUCT_MONGO_URI
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/backend" }}
        property: PRODUCT_MONGO_URI
    - secretKey: ORDER_MONGO_URI
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | default "grocery/backend" }}
        property: ORDER_MONGO_URI
{{- end }}
