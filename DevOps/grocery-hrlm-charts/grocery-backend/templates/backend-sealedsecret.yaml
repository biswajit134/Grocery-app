{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.secretName | default "backend-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grocery-backend.labels" . | nindent 4 }}
spec:
  encryptedData:
    JWT_SECRET: {{ .Values.sealedSecret.encryptedData.JWT_SECRET | quote }}
    AUTH_MONGO_URI: {{ .Values.sealedSecret.encryptedData.AUTH_MONGO_URI | quote }}
    PRODUCT_MONGO_URI: {{ .Values.sealedSecret.encryptedData.PRODUCT_MONGO_URI | quote }}
    ORDER_MONGO_URI: {{ .Values.sealedSecret.encryptedData.ORDER_MONGO_URI | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.secretName | default "backend-secret" }}
      namespace: {{ .Values.namespace }}
      labels:
        {{- include "grocery-backend.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
