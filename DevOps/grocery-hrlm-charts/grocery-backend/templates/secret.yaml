{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName | default "backend-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grocery-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AUTH_MONGO_URI: {{ .Values.secrets.authMongoUri | quote }}
  PRODUCT_MONGO_URI: {{ .Values.secrets.productMongoUri | quote }}
  ORDER_MONGO_URI: {{ .Values.secrets.orderMongoUri | quote }}
{{- end }}
