namespace: grocery-backend

global:
  environment: production
  imagePullPolicy: IfNotPresent
  podAntiAffinity: true

# Zero-downtime rolling update strategy
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

# Termination grace period
terminationGracePeriodSeconds: 30

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Istio Traffic Management
istio:
  enabled: true
  destinationRule:
    enabled: true
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 1024
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 10s
      maxEjectionPercent: 50

# Network Policy
networkPolicy:
  enabled: true

# ConfigMap Data (Discovery URLs)
config:
  authServiceUrl: "http://auth-svc.grocery-backend.svc.cluster.local:5001"
  productServiceUrl: "http://product-svc.grocery-backend.svc.cluster.local:5002"
  orderServiceUrl: "http://order-svc.grocery-backend.svc.cluster.local:5003"
  redisUrl: "redis://redis-svc.grocery-database.svc.cluster.local:6379"

# Secret Data (Sensitive Credentials)
# In production and GitOps, secrets are managed out-of-band via SealedSecrets, ExternalSecrets, or Vault.
# Point existingSecret to the pre-provisioned Kubernetes secret.
secrets:
  existingSecret: "backend-secret"
  secretName: "backend-secret"
  jwtSecret: ""
  authMongoUri: ""
  productMongoUri: ""
  orderMongoUri: ""

# External Secrets Operator configuration (HashiCorp Vault)
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  vaultPath: "grocery/backend"


# Microservices
services:
  apiGateway:
    enabled: true
    appName: api-gateway
    serviceName: api-gateway-svc
    deploymentName: api-gateway-dp
    replicaCount: 2
    image:
      repository: biswajit134/grocery-api-gateway
      tag: latest
    port: 5000
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  authService:
    enabled: true
    appName: auth-service
    serviceName: auth-svc
    deploymentName: auth-service-dp
    replicaCount: 2
    image:
      repository: biswajit134/grocery-auth-service
      tag: latest
    port: 5001
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  orderService:
    enabled: true
    appName: order-service
    serviceName: order-svc
    deploymentName: order-service-dp
    replicaCount: 2
    image:
      repository: biswajit134/grocery-order-service
      tag: latest
    port: 5003
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  productService:
    enabled: true
    appName: product-service
    serviceName: product-svc
    deploymentName: product-service-dp
    replicaCount: 2
    image:
      repository: biswajit134/grocery-product-service
      tag: latest
    port: 5002
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
